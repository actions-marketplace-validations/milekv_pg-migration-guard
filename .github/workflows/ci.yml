name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create a migration fixture
        run: |
          mkdir -p action-fixture
          echo 'CREATE INDEX orders_created_at_idx ON orders (created_at);' > action-fixture/001_index.sql
      - name: Run the local action
        uses: ./
        with:
          paths: action-fixture/**/*.sql
          fail-on: never
