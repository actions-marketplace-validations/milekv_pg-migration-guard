name: Bug report
description: Report incorrect CLI behavior or an execution failure
title: "Bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: Minimal SQL reproduction
      description: Remove private names and data before submitting.
      render: sql
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pg-migration-guard version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      description: Enter not connected if the database option was not used.
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Remove connection strings, credentials, and private paths.
      render: shell
    validations:
      required: true
