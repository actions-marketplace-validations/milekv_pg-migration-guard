name: False positive
description: Report SQL that is flagged incorrectly
title: "False positive: "
body:
  - type: textarea
    id: sql
    attributes:
      label: Minimal SQL reproduction
      description: Include only the statements required to reproduce the finding.
      render: sql
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule
      placeholder: destructive-change
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is the finding incorrect?
      description: Include PostgreSQL documentation or observed behavior when relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pg-migration-guard version
      placeholder: 0.1.1
    validations:
      required: true
